name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.11"
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - envs/dev/ap-southeast-1/networking
          - envs/dev/ap-southeast-1/ecs
          - envs/uat/ap-southeast-1/networking
          - envs/prod/ap-southeast-1/networking
          - envs/shared-services/ap-southeast-1/kms
          - envs/shared-services/ap-southeast-1/s3-logs
          - envs/shared-services/ap-southeast-1/ssm
          - envs/shared-services/ap-southeast-1/ecr
          - examples/iam/pod-identity-s3
          - examples/networking/minimal
          - examples/iam/alb-controller
          - examples/iam/cluster-access
          - examples/iam/cross-account
          - examples/iam/cross-account-secrets
          - examples/iam/cross-account-sns-sqs
          - examples/iam/cross-account-sns-sqs-stg
          - examples/iam/cross-region-pipeline
          - examples/iam/cross-region-s3
          - examples/iam/external-dns-cross-account
          - examples/iam/s3-eks
          - examples/iam/s3-events
          - examples/iam/s3-go-compute-matrix
          - examples/iam/storage-drivers
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.11"
      - name: Init
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - modules/networking/vpc
          - modules/networking/security-group
          - modules/networking/alb
          - modules/networking/vpc-peering
          - modules/networking/transit-gateway
          - modules/networking/privatelink
          - modules/security/wafv2
          - modules/security/iam-role
          - modules/security/pod-identity
          - modules/data/s3-bucket
          - modules/data/s3-logs
          - modules/data/kms-key
          - modules/data/ssm-parameter
          - modules/compute/ecr
          - modules/compute/ecs-service
          - modules/compute/eks
          - modules/messaging/sqs-with-dlq
          - modules/_legacy/irsa-role
          - envs/dev/ap-southeast-1/networking
          - envs/dev/ap-southeast-1/ecs
          - envs/prod/ap-southeast-1/networking
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Init TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run TFLint
        working-directory: ${{ matrix.directory }}
        run: tflint --format compact

  trivy:
    name: Trivy (Terraform Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: 1
          severity: HIGH,CRITICAL

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true

  terraform-test:
    name: Terraform Test (module smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.11"
      - name: Run module tests
        run: |
          terraform -chdir=tests init -backend=false -input=false
          terraform -chdir=tests test

  # --------------------------------------------------------------------------
  # floci emulator integration (floci :4566 only) — applies a real root.
  # --------------------------------------------------------------------------
  floci-integration:
    name: floci Emulator Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [terraform-fmt, terraform-validate, tflint]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.11"
      - name: Start floci
        run: |
          docker compose up -d floci
          echo "Waiting for floci (:4566)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null 2>&1; then
              echo "floci ready."; break
            fi
            echo "  attempt $i/30..."; sleep 3
          done
          curl -s http://localhost:4566/_localstack/health | python3 -m json.tool || true
      - name: Apply dev ECS env on floci (S3 backend + native lock)
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: "111111111111"
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-southeast-1
          AWS_S3_ADDRESSING_STYLE: path
          AWS_PAGER: ""
        run: |
          set -e
          ./scripts/bootstrap-state-bucket.sh dnl-tfstate-floci ap-southeast-1
          NET=envs/dev/ap-southeast-1/networking
          ECS=envs/dev/ap-southeast-1/ecs
          terraform -chdir=$NET init -input=false -backend-config=backend.floci.hcl
          terraform -chdir=$NET apply -auto-approve -var enable_s3_gateway_endpoint=false
          terraform -chdir=$ECS init -input=false -backend-config=backend.floci.hcl
          terraform -chdir=$ECS apply -auto-approve -var state_bucket=dnl-tfstate-floci \
            -var 'remote_state_config={access_key="111111111111",secret_key="test",use_path_style=true,skip_credentials_validation=true,skip_requesting_account_id=true,skip_metadata_api_check=true,endpoints={s3="http://localhost:4566"}}'
          terraform -chdir=$ECS output
