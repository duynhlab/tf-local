name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - live/lab/dev/networking
          - live/lab/prod/networking
          - iam/alb-controller
          - iam/cluster-access
          - iam/cross-account
          - iam/cross-account-secrets
          - iam/cross-region-pipeline
          - iam/cross-region-s3
          - iam/external-dns-cross-account
          - iam/prod
          - iam/s3-eks
          - iam/s3-events
          - iam/s3-go-compute-matrix
          - iam/stg
          - iam/storage-drivers
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"

      - name: Init
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - modules/networking/vpc
          - modules/lab-provider
          - modules/iam/irsa_role
          - modules/iam/sqs_with_dlq
          - modules/vpc-peering
          - modules/privatelink
          - modules/transit-gateway
          - modules/waf-v2
          - live/lab/dev/networking
          - live/lab/prod/networking
          - iam/alb-controller
          - iam/cluster-access
          - iam/cross-account
          - iam/cross-account-secrets
          - iam/cross-region-pipeline
          - iam/cross-region-s3
          - iam/external-dns-cross-account
          - iam/prod
          - iam/s3-eks
          - iam/s3-events
          - iam/s3-go-compute-matrix
          - iam/stg
          - iam/storage-drivers
    steps:
      - uses: actions/checkout@v6

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        working-directory: ${{ matrix.directory }}
        run: tflint --format compact

  tfsec:
    name: Trivy (Terraform Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          exit-code: 1
          severity: HIGH,CRITICAL

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true

  # --------------------------------------------------------------------------
  # Hybrid emulator integration (floci :4566 + ministack :4567)
  # - environments/* use hybrid endpoints
  # - iam/* use ministack :4567 for all declared services
  # --------------------------------------------------------------------------
  hybrid-integration:
    name: Hybrid Emulator Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [terraform-fmt, terraform-validate, tflint]
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"

      - name: Start floci and ministack
        run: |
          docker compose up -d
          echo "Waiting for floci (:4566) and ministack (:4567)..."
          for i in $(seq 1 30); do
            floci_ok=0
            mini_ok=0
            curl -sf http://localhost:4566/_localstack/health > /dev/null 2>&1 && floci_ok=1
            curl -sf http://localhost:4567/_ministack/health > /dev/null 2>&1 && mini_ok=1
            if [ "$floci_ok" = "1" ] && [ "$mini_ok" = "1" ]; then
              echo "Both emulators ready."
              break
            fi
            echo "  Attempt $i/30 (floci=$floci_ok ministack=$mini_ok)..."
            sleep 3
          done
          echo "Floci health:"
          curl -s http://localhost:4566/_localstack/health | python3 -m json.tool || true
          echo "Ministack health:"
          curl -s http://localhost:4567/_ministack/health | python3 -m json.tool || true

      - name: Test Dev Environment
        run: |
          cd live/lab/dev/networking
          echo "=== Hybrid: Dev Environment ==="
          terraform fmt -check
          terraform init -input=false
          terraform validate
          terraform apply -auto-approve
          terraform output
          terraform destroy -auto-approve

      - name: Test IAM Staging
        run: |
          cd iam/stg
          echo "=== Ministack: IAM Staging ==="
          terraform fmt -check
          terraform init -input=false
          terraform validate
          terraform apply -auto-approve
          terraform output
          terraform destroy -auto-approve

      - name: Test IAM Production
        run: |
          cd iam/prod
          echo "=== Ministack: IAM Production ==="
          terraform fmt -check
          terraform init -input=false
          terraform validate
          terraform apply -auto-approve
          terraform output
          terraform destroy -auto-approve

      - name: Test Prod Environment
        run: |
          cd live/lab/prod/networking
          echo "=== Hybrid: Prod Environment ==="
          terraform fmt -check
          terraform init -input=false
          terraform validate
          terraform apply -auto-approve
          terraform output
          terraform output -raw main_vpc_id > /dev/null
          terraform output -raw peering_connection_id > /dev/null
          terraform state list | grep -q "module.main_vpc.aws_vpc.this"
          terraform state list | grep -q "module.vpc_peering.aws_vpc_peering_connection.this"
          terraform destroy -auto-approve

      - name: Cleanup
        if: always()
        run: docker compose down -v 2>/dev/null || true
