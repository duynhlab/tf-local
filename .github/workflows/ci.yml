name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - live/envs/dev/ap-southeast-1/networking
          - live/envs/uat/ap-southeast-1/networking
          - live/envs/prod/ap-southeast-1/networking
          - examples/iam/alb-controller
          - examples/iam/cluster-access
          - examples/iam/cross-account
          - examples/iam/cross-account-secrets
          - examples/iam/cross-account-sns-sqs
          - examples/iam/cross-account-sns-sqs-stg
          - examples/iam/cross-region-pipeline
          - examples/iam/cross-region-s3
          - examples/iam/external-dns-cross-account
          - examples/iam/s3-eks
          - examples/iam/s3-events
          - examples/iam/s3-go-compute-matrix
          - examples/iam/storage-drivers
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
      - name: Init
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - modules/networking/vpc
          - modules/networking/vpc-peering
          - modules/networking/transit-gateway
          - modules/networking/privatelink
          - modules/security/wafv2
          - modules/messaging/sqs-with-dlq
          - modules/_legacy/irsa-role
          - modules/lab-provider
          - live/envs/dev/ap-southeast-1/networking
          - live/envs/prod/ap-southeast-1/networking
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Init TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run TFLint
        working-directory: ${{ matrix.directory }}
        run: tflint --format compact

  trivy:
    name: Trivy (Terraform Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          exit-code: 1
          severity: HIGH,CRITICAL

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true

  terraform-test:
    name: Terraform Test (module smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
      - name: Run module tests
        run: |
          terraform -chdir=tests init -backend=false -input=false
          terraform -chdir=tests test

  # --------------------------------------------------------------------------
  # floci emulator integration (floci :4566 only) — applies a real root.
  # --------------------------------------------------------------------------
  floci-integration:
    name: floci Emulator Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [terraform-fmt, terraform-validate, tflint]
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
      - name: Start floci
        run: |
          docker compose up -d floci
          echo "Waiting for floci (:4566)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null 2>&1; then
              echo "floci ready."; break
            fi
            echo "  attempt $i/30..."; sleep 3
          done
          curl -s http://localhost:4566/_localstack/health | python3 -m json.tool || true
      - name: Apply dev networking on floci
        run: |
          cd live/envs/dev/ap-southeast-1/networking
          terraform fmt -check
          terraform init -input=false
          terraform validate
          terraform apply -auto-approve
          terraform output
          terraform destroy -auto-approve
