# Track B — real AWS roots (live/aws/*). OIDC and secrets are placeholders until wired in GitHub.
name: AWS CI

on:
  push:
    branches: [main, master]
    paths:
      - "live/aws/**"
      - "bootstrap/**"
      - "modules/**"
      - "policies/**"
      - ".checkov.yml"
      - ".github/workflows/aws-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "live/aws/**"
      - "bootstrap/**"
      - "modules/**"
      - "policies/**"
      - ".checkov.yml"
      - ".github/workflows/aws-ci.yml"
  workflow_dispatch:
  schedule:
    # Drift detection — plan only; requires OIDC vars and TF_STATE_BUCKET secret
    - cron: "0 6 * * 1"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "~1.9"
  AWS_REGION: ap-southeast-1

jobs:
  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  terraform-validate-aws:
    name: Validate AWS roots
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - bootstrap
          - live/aws/dev/ap-southeast-1/networking
          - live/aws/prod/ap-southeast-1/networking
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  terraform-test:
    name: Terraform Test (plan-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Run module tests
        run: |
          terraform -chdir=tests init -backend=false -input=false
          terraform -chdir=tests test

  checkov:
    name: Checkov (hard fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yml
          framework: terraform
          quiet: true
          soft_fail: false
          download_external_modules: false

  terraform-plan-dev:
    name: Plan dev (OIDC)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule'
    needs: [terraform-fmt, terraform-validate-aws, checkov, terraform-test]
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_DEV_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init with backend
        if: vars.AWS_DEV_ROLE_ARN != '' && secrets.TF_STATE_BUCKET != ''
        working-directory: live/aws/dev/ap-southeast-1/networking
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=dev/ap-southeast-1/networking/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Plan
        if: vars.AWS_DEV_ROLE_ARN != ''
        working-directory: live/aws/dev/ap-southeast-1/networking
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan artifact
        if: vars.AWS_DEV_ROLE_ARN != '' && success()
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-aws-dev-networking
          path: live/aws/dev/ap-southeast-1/networking/tfplan
          retention-days: 7

      - name: Skip plan (OIDC not configured)
        if: vars.AWS_DEV_ROLE_ARN == ''
        run: echo "::notice::Set vars.AWS_DEV_ROLE_ARN and secrets.TF_STATE_BUCKET to enable AWS plan + drift."

  terraform-plan-prod-network:
    name: Plan prod network (OIDC)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule'
    needs: [terraform-fmt, terraform-validate-aws, checkov, terraform-test]
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_PROD_NETWORK_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PROD_NETWORK_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init with backend
        if: vars.AWS_PROD_NETWORK_ROLE_ARN != '' && secrets.TF_STATE_BUCKET != ''
        working-directory: live/aws/prod/ap-southeast-1/networking
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=prod/ap-southeast-1/networking/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Plan
        if: vars.AWS_PROD_NETWORK_ROLE_ARN != ''
        working-directory: live/aws/prod/ap-southeast-1/networking
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan artifact
        if: vars.AWS_PROD_NETWORK_ROLE_ARN != '' && success()
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-aws-prod-networking
          path: live/aws/prod/ap-southeast-1/networking/tfplan
          retention-days: 7

      - name: Skip plan (OIDC not configured)
        if: vars.AWS_PROD_NETWORK_ROLE_ARN == ''
        run: echo "::notice::Set vars.AWS_PROD_NETWORK_ROLE_ARN and secrets.TF_STATE_BUCKET to enable AWS plan + drift."
