###############################################################################
# Hybrid local AWS emulator stack
#
# floci      :4566 → compute / identity / data plane
#                   (IAM, STS, S3, SNS, SQS, KMS, EKS real k3s, ECR, ECS,
#                    Lambda, ElastiCache, RDS, MSK, OpenSearch, Athena, …)
#
# ministack  :4567 → enterprise networking + edge security
#                   (advanced EC2/VPC: NAT GW, VPC Endpoints, NACL,
#                    Flow Logs, Peering, Egress-only IGW, WAF v2, ELBv2)
#
# Terraform providers split their `endpoints {}` block across the two
# emulators per service. See environments/*/providers.tf.
###############################################################################
services:
  floci:
    image: docker.io/floci/floci:latest
    container_name: tf-lab-floci
    ports:
      - "4566:4566"
      - "9169:9169"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      LOCALSTACK_PARITY: "true"
      QUARKUS_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      lab:
        aliases:
          - localhost.floci.io

  ministack:
    image: docker.io/ministackorg/ministack:latest
    container_name: tf-lab-ministack
    ports:
      - "4567:4566"
    environment:
      GATEWAY_PORT: 4566
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ministack_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      lab: {}

volumes:
  floci_data:
  ministack_data:

networks:
  lab:
    name: tf_lab
